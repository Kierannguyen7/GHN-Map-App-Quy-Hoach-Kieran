border-bottom:1px solid #e2e8f0;padding:9px}.v85-table td:first-child{border-left:1px solid #e2e8f0;border-radius:12px 0 0 12px;font-weight:900}.v85-table td:last-child{border-right:1px solid #e2e8f0;border-radius:0 12px 12px 0}.v85-bad{color:#dc2626;font-weight:900}.v85-ok{color:#16a34a;font-weight:900}.v85-capacity{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.v85-cap{border-radius:16px;padding:13px 15px;background:#fff;border:1px solid #dbe4f0}.v85-cap span{display:block;color:#64748b;font-size:13px;font-weight:900}.v85-cap b{font-size:22px}.v85-cap small{display:block;color:#64748b;font-weight:700}.v85-cap.red{border-color:#fecaca;background:#fff1f2}.v85-cap.green{border-color:#bbf7d0;background:#f0fdf4}.v85-cap.orange{border-color:#fed7aa;background:#fff7ed}.v85-cap.blue{border-color:#bfdbfe;background:#eff6ff}.v85-route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-top:10px}.v85-route-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:9px}.v85-route-card small{display:block;color:#475569;margin-top:4px;line-height:1.35}.v85-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.v85-pill{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#f1f5f9}.v85-route-label{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:2px 6px;font-weight:900;font-size:11px;color:#0f172a}.v85-load-note{padding:10px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#78350f;font-weight:800;margin-top:10px;font-size:13px}
@media(max-width:1100px){.v85-layout{grid-template-columns:1fr}.v85-kpis,.v85-capacity{grid-template-columns:repeat(2,1fr)}.v85-map{height:460px;min-height:460px}}@media(max-width:700px){#v82OpsPage{inset:70px 0 0;padding:10px}.v85-kpis,.v85-capacity{grid-template-columns:1fr}.v85-hero{border-radius:16px}.v85-hero h2{font-size:22px}}

<script>
/* V85 final override */
(function(){
  const LS_VOL='ghn_v80_uploaded_vol_by_ward', LS_STAFF='ghn_v77_staff_by_branch', LS_NVXL='ghn_v79_nvxl_by_branch';
  let volMap={}, staffMap={}, nvxlMap={}, opsMap=null, wardLayer=null, branchLayer=null, routeLayer=null;
  const colors=['#ef4444','#2563eb','#16a34a','#f97316','#8b5cf6','#06b6d4','#e11d48','#84cc16','#a855f7','#0ea5e9','#f59e0b','#22c55e','#dc2626','#4f46e5','#14b8a6','#f43f5e'];
  function reload(){try{volMap=JSON.parse(localStorage.getItem(LS_VOL)||'{}')||{}}catch(e){volMap={}};try{staffMap=JSON.parse(localStorage.getItem(LS_STAFF)||'{}')||{}}catch(e){staffMap={}};try{nvxlMap=JSON.parse(localStorage.getItem(LS_NVXL)||'{}')||{}}catch(e){nvxlMap={}}}
  reload();
  const fmt=n=>(Number(n)||0).toLocaleString('vi-VN',{maximumFractionDigits:1});
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^(xa|phuong|thi tran|tt|p)\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
  function getAll(){try{return Array.isArray(all)?all:[]}catch(e){return[]}}
  function getBranches(){try{return Array.isArray(branches)?branches:[]}catch(e){return[]}}
  function props(f){return (f&&f.properties)||{}}
  function branchOf(f){const p=props(f);return p.branch||p.bc_name||p.buu_cuc||p.post_office||'Chưa gán'}
  function wardOf(f){const p=props(f);return p.ward||p.ward_name||p.name||p.ten_xa||''}
  function key(ward,bc){return norm(ward)+'__'+norm(bc||'')}
  function isTown(name){return /^phường/i.test(name)||/^thị trấn/i.test(name)||/^tt/i.test(name)}
  function prodByWard(name){return isTown(name)?75:65}
  function centroidGeom(geom){let pts=[]; if(!geom)return null; const polys=geom.type==='Polygon'?[geom.coordinates]:(geom.type==='MultiPolygon'?geom.coordinates:[]); polys.forEach(poly=>poly.forEach(ring=>pts.push(...ring.slice(0,-1)))); if(!pts.length)return null; return [pts.reduce((s,p)=>s+Number(p[0]||0),0)/pts.length, pts.reduce((s,p)=>s+Number(p[1]||0),0)/pts.length]}
  function wardVol(f){const p=props(f), ward=wardOf(f), bc=branchOf(f); const up=volMap[key(ward,bc)]||volMap[norm(ward)]||null; const vg=Number(up?.vol_giao ?? p.vol_giao ?? p.volume_giao ?? p.delivery_volume ?? p.vol ?? 0)||0; const vl=Number(up?.vol_lay ?? p.vol_lay ?? p.volume_lay ?? p.pickup_volume ?? 0)||0; return {vol_giao:vg,vol_lay:vl,vol_q:vg+vl/4,uploaded:!!up};}
  function syncToNetwork(){
    getAll().forEach(f=>{const v=wardVol(f); f.properties=f.properties||{}; f.properties.vol_giao=v.vol_giao; f.properties.vol_lay=v.vol_lay; f.properties.vol_q=v.vol_q; f.properties.nvpttt_need=Math.ceil(v.vol_q/prodByWard(wardOf(f)));});
    try{rebuildBranches&&rebuildBranches(); apply&&apply(); renderStats&&renderStats(); updateAMList&&updateAMList()}catch(e){}
  }
  function branchCap(bc){
    const b=getBranches().find(x=>x.branch===bc)||{}; const fs=getAll().filter(f=>branchOf(f)===bc); let vg=0,vl=0,vq=0,need=0, wards=[];
    fs.forEach(f=>{const name=wardOf(f), v=wardVol(f), p=prodByWard(name), c=centroidGeom(f.geometry); vg+=v.vol_giao; vl+=v.vol_lay; vq+=v.vol_q; need+=Math.ceil(v.vol_q/p); wards.push({name,prod:p,vol_q:v.vol_q,vol_giao:v.vol_giao,vol_lay:v.vol_lay,centroid:c});});
    if(!fs.length||!vq){vg=Number(b.vol_giao||0)||vg; vl=Number(b.vol_lay||0)||vl; vq=vg+vl/4; need=need||Math.ceil(vq/65)}
    const cur=Number(staffMap[bc]??b.nvpttt_current??0)||0, xl=Number(nvxlMap[bc]??b.nvxl_current??0)||0;
    return {branch:bc, lat:Number(b.lat)||10.35, lng:Number(b.lng)||106, count:fs.length||Number(b.count)||0, wards, vol_giao:vg, vol_lay:vl, vol_q:vq, need, current:cur, nvxl_need:Math.ceil((vg+vl)/600), nvxl_current:xl, nvpttt_capacity:cur*65, nvxl_capacity:xl*600};
  }
  function caps(){return getBranches().filter(b=>b&&!b.isVirtual).map(b=>branchCap(b.branch))}
  function loadXLSX(cb){if(window.XLSX)return cb(); const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=cb;s.onerror=()=>alert('Không tải được thư viện Excel');document.head.appendChild(s)}
  function pick(r,names){const ks=Object.keys(r||{}); for(const n of names){const k=ks.find(x=>norm(x)===norm(n)); if(k!=null)return r[k]} return ''}
  function readFile(file,cb){if(!file)return; loadXLSX(()=>{const fr=new FileReader();fr.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(sh,{defval:''}))}catch(err){alert('Lỗi đọc file: '+err.message)}};fr.readAsArrayBuffer(file)})}
  function saveVol(rows){let n=0; rows.forEach(r=>{const ward=String(pick(r,['ward_name','ward','ten xa','tên xã','xa phuong','xã phường'])||'').trim(), bc=String(pick(r,['bc_name','branch','buu cuc','bưu cục','ten buu cuc','tên bưu cục'])||'').trim(); const vg=Number(String(pick(r,['vol_giao','volume_giao','giao','vol giao'])||'').replace(',','.'))||0, vl=Number(String(pick(r,['vol_lay','volume_lay','lay','lấy','vol lay'])||'').replace(',','.'))||0; if(ward){volMap[key(ward,bc)]={ward_name:ward,bc_name:bc,vol_giao:vg,vol_lay:vl}; volMap[norm(ward)]={ward_name:ward,bc_name:bc,vol_giao:vg,vol_lay:vl}; n++}}); localStorage.setItem(LS_VOL,JSON.stringify(volMap)); syncToNetwork(); renderOps(); alert('Đã upload Vol '+n+' xã/phường. Định biên và 2 bản đồ đã cập nhật.');}
  function saveStaff(rows){let n=0; rows.forEach(r=>{const bc=String(pick(r,['bc_name','branch','buu cuc','bưu cục','ten buu cuc','tên bưu cục'])||'').trim(); const pt=Number(String(pick(r,['nvpttt_hien_co','nvpttt','nhan su nvpttt','nhân sự nvpttt','hien co','hiện có'])||'').replace(',','.'))||0, xl=Number(String(pick(r,['nvxl_hien_co','nvxl','nhan su nvxl','nhân sự nvxl','xu ly','xử lý'])||'').replace(',','.'))||0; if(bc){staffMap[bc]=pt;nvxlMap[bc]=xl;n++}}); localStorage.setItem(LS_STAFF,JSON.stringify(staffMap)); localStorage.setItem(LS_NVXL,JSON.stringify(nvxlMap)); syncToNetwork(); renderOps(); alert('Đã upload nhân sự '+n+' bưu cục. 2 bản đồ đã cập nhật.');}
  function sampleXlsx(name,rows){loadXLSX(()=>{const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Mau upload');XLSX.writeFile(wb,name)})}
  function dist(a,b){const dx=(a.lng-b.lng)*111*Math.cos((a.lat+b.lat)/2*Math.PI/180),dy=(a.lat-b.lat)*111;return Math.sqrt(dx*dx+dy*dy)}
  function nearest(points,start){let pts=points.slice(),out=[],cur=start; while(pts.length){let bi=0,bd=1e9; pts.forEach((p,i)=>{const d=dist(cur,p); if(d<bd){bd=d;bi=i}}); const nx=pts.splice(bi,1)[0]; out.push(nx); cur=nx} return out}
  function routePlan(cap){const need=Math.max(1,cap.need||1), start={lat:cap.lat,lng:cap.lng}; const buckets=Array.from({length:need},(_,i)=>({nv:i+1,vol:0,km:0,wards:[],color:colors[i%colors.length]})); let chunks=[]; cap.wards.forEach(w=>{if(!w.centroid)return; const lng=Number(w.centroid[0]),lat=Number(w.centroid[1]); if(!lat||!lng)return; const parts=Math.max(1,Math.ceil((w.vol_q||0)/Math.max(1,w.prod))); for(let i=1;i<=parts;i++)chunks.push({name:w.name,lat,lng,vol:(w.vol_q||0)/parts,part:i,parts});}); chunks=nearest(chunks,start); chunks.forEach(ch=>{const t=buckets.reduce((a,b)=>a.vol<=b.vol?a:b); t.wards.push(ch); t.vol+=ch.vol}); buckets.forEach(b=>{let cur=start,km=0; b.wards=nearest(b.wards,start); b.wards.forEach(p=>{km+=dist(cur,p);cur=p}); if(b.wards.length)km+=dist(cur,start); b.km=km}); return buckets}
  function markerColor(c){const ptShort=c.need-c.current, load=c.current?c.vol_q/Math.max(1,c.nvpttt_capacity):999; if(ptShort>0)return '#ef4444'; if(load>1)return '#f97316'; return '#16a34a'}
  function ensureMap(){const el=document.getElementById('v85OpsMap'); if(!el)return; if(opsMap){setTimeout(()=>opsMap.invalidateSize(),80);return} opsMap=L.map(el,{zoomControl:true}).setView([10.25,106.1],8); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(opsMap); wardLayer=L.layerGroup().addTo(opsMap); branchLayer=L.layerGroup().addTo(opsMap); routeLayer=L.layerGroup().addTo(opsMap); drawOpsMap();}
  function drawOpsMap(){if(!opsMap)return; wardLayer.clearLayers(); branchLayer.clearLayers(); routeLayer.clearLayers(); getAll().forEach(f=>{const bc=branchOf(f), c=branchCap(bc), v=wardVol(f); const fill=markerColor(c); L.geoJSON(f,{style:{color:'#475569',weight:.8,fillColor:fill,fillOpacity:v.vol_q?0.23:0.07},onEachFeature:(ff,l)=>l.bindTooltip(`${esc(wardOf(f))}<br>${esc(bc)}<br>Vol QĐ: ${fmt(v.vol_q)}`)}).addTo(wardLayer)}); caps().forEach(c=>{if(!c.lat||!c.lng)return; L.circleMarker([c.lat,c.lng],{radius:7,color:'#fff',weight:2,fillColor:markerColor(c),fillOpacity:1}).bindTooltip(`${esc(c.branch)}<br>Vol QĐ ${fmt(c.vol_q)}<br>NVPTTT ${c.current}/${c.need}<br>NVXL ${c.nvxl_current}/${c.nvxl_need}`).on('click',()=>drawRoute(c.branch)).addTo(branchLayer)}); try{opsMap.fitBounds(branchLayer.getBounds(),{padding:[25,25]})}catch(e){} }
  function drawRoute(bc){ensureMap(); const cap=branchCap(bc), routes=routePlan(cap), start=[cap.lat,cap.lng]; routeLayer.clearLayers(); routes.forEach(r=>{if(!r.wards.length)return; const coords=[start].concat(r.wards.map(w=>[w.lat,w.lng])).concat([start]); L.polyline(coords,{color:r.color,weight:4,opacity:.9,dashArray:'8,5'}).addTo(routeLayer); r.wards.forEach(w=>L.circleMarker([w.lat,w.lng],{radius:5,color:r.color,weight:2,fillColor:'#fff',fillOpacity:1}).bindTooltip(`NV${String(r.nv).padStart(2,'0')} · ${esc(w.name)} · ${fmt(w.vol)} QĐ`).addTo(routeLayer)); const mid=r.wards[0]; if(mid)L.marker([mid.lat,mid.lng],{icon:L.divIcon({className:'v85-route-label',html:'NV'+String(r.nv).padStart(2,'0')})}).addTo(routeLayer)}); L.circleMarker(start,{radius:9,color:'#fff',weight:3,fillColor:'#ff5a00',fillOpacity:1}).bindTooltip(cap.branch).addTo(routeLayer); try{opsMap.fitBounds(routeLayer.getBounds(),{padding:[40,40]})}catch(e){} renderRoute(cap,routes)}
  function renderRoute(cap,routes){const el=document.getElementById('v85RouteDetail'); if(!el)return; el.innerHTML=`<div class="v85-capacity" style="grid-template-columns:repeat(2,1fr)"><div class="v85-cap ${cap.need>cap.current?'red':'green'}"><span>NVPTTT cần/hiện</span><b>${cap.need}/${cap.current}</b><small>Max ${fmt(cap.nvpttt_capacity)} đơn/ngày</small></div><div class="v85-cap ${cap.nvxl_need>cap.nvxl_current?'red':'green'}"><span>NVXL cần/hiện</span><b>${cap.nvxl_need}/${cap.nvxl_current}</b><small>Max ${fmt(cap.nvxl_capacity)} đơn/ngày</small></div></div><div class="v85-route-grid">${routes.map(r=>`<div class="v85-route-card" style="border-left:5px solid ${r.color}"><b>NV${String(r.nv).padStart(2,'0')}</b> · ${fmt(r.vol)} QĐ · ${fmt(r.km)} km<small>${r.wards.map(w=>esc(w.name)+(w.parts>1?` (${w.part}/${w.parts})`:'')).join(' → ')||'Chưa có tọa độ xã/phường'}</small></div>`).join('')}</div>`}
  function capBand(cs){const vol=cs.reduce((s,c)=>s+c.vol_q,0),need=cs.reduce((s,c)=>s+c.need,0),cur=cs.reduce((s,c)=>s+c.current,0),process=cs.reduce((s,c)=>s+c.vol_giao+c.vol_lay,0),xlNeed=cs.reduce((s,c)=>s+c.nvxl_need,0),xl=cs.reduce((s,c)=>s+c.nvxl_current,0),capPT=cs.reduce((s,c)=>s+c.nvpttt_capacity,0),capXL=cs.reduce((s,c)=>s+c.nvxl_capacity,0); return `<div class="v85-capacity"><div class="v85-cap orange"><span>Max Capacity NVPTTT/ngày</span><b>${fmt(capPT)}</b><small>${cur} NVPTTT · tải QĐ ${fmt(vol)}</small></div><div class="v85-cap blue"><span>Max Capacity NVXL/ngày</span><b>${fmt(capXL)}</b><small>${xl} NVXL × 600 · tải xử lý ${fmt(process)}</small></div><div class="v85-cap ${capPT>=vol?'green':'red'}"><span>Dư/Thiếu NVPTTT</span><b>${capPT-vol>=0?'+':''}${fmt(capPT-vol)}</b><small>Cần ${need} · hiện ${cur}</small></div><div class="v85-cap ${capXL>=process?'green':'red'}"><span>Dư/Thiếu NVXL</span><b>${capXL-process>=0?'+':''}${fmt(capXL-process)}</b><small>Cần ${xlNeed} · hiện ${xl}</small></div></div>`}
  function renderOps(){reload();syncToNetwork(); document.body.classList.add('v85-ops-mode');document.body.classList.remove('v82-ops-mode','v77-ops-mode'); const page=document.getElementById('v82OpsPage'); if(!page)return; const cs=caps(), totalVol=cs.reduce((s,c)=>s+c.vol_q,0), need=cs.reduce((s,c)=>s+c.need,0), cur=cs.reduce((s,c)=>s+c.current,0), xlNeed=cs.reduce((s,c)=>s+c.nvxl_need,0), xl=cs.reduce((s,c)=>s+c.nvxl_current,0), totalShort=cs.reduce((s,c)=>s+Math.max(0,c.need-c.current)+Math.max(0,c.nvxl_need-c.nvxl_current),0); const rows=cs.slice().sort((a,b)=>(Math.max(0,b.need-b.current)-Math.max(0,a.need-a.current))||(b.vol_q-a.vol_q)).map(c=>`<tr><td>${esc(c.branch)}</td><td>${fmt(c.vol_q)}</td><td>${c.current}/${c.need}${c.need>c.current?` <span class="v85-bad">-${c.need-c.current}</span>`:' <span class="v85-ok">Đủ</span>'}</td><td>${fmt(c.nvpttt_capacity)}</td><td>${c.nvxl_current}/${c.nvxl_need}${c.nvxl_need>c.nvxl_current?` <span class="v85-bad">-${c.nvxl_need-c.nvxl_current}</span>`:' <span class="v85-ok">Đủ</span>'}</td><td>${fmt(c.nvxl_capacity)}</td><td><button class="v85-btn orange" data-bc="${esc(c.branch)}">Vẽ tuyến</button></td></tr>`).join('');
    const hasVol=totalVol>0; page.innerHTML=`<div class="v85-wrap"><div class="v85-hero"><div><h2>📈 Hiệu suất vận hành</h2><p>2 bản đồ riêng tách bạch · Upload Vol/Nhân sự là nguồn dữ liệu chung · Có dữ liệu Vol thì chạy định biên và vẽ cung đường</p></div><button class="v85-btn orange" id="v85Back">← Về quy hoạch mạng lưới</button></div><div class="v85-kpis"><div class="v85-kpi"><span>Bưu cục</span><b>${cs.length}</b></div><div class="v85-kpi"><span>Vol quy đổi</span><b>${fmt(totalVol)}</b></div><div class="v85-kpi"><span>NVPTTT cần</span><b>${need}</b></div><div class="v85-kpi"><span>NVPTTT hiện</span><b>${cur}</b></div><div class="v85-kpi"><span>NVXL cần</span><b>${xlNeed}</b></div><div class="v85-kpi"><span>NVXL hiện</span><b>${xl}</b></div><div class="v85-kpi"><span>Tổng thiếu</span><b>${totalShort}</b></div></div>${capBand(cs)}<div class="v85-layout"><div><div class="v85-card"><h3>1) Upload sản lượng xã/phường</h3><div class="v85-muted">Excel: <b>ward_name, bc_name, vol_giao, vol_lay</b></div><input id="v85VolFile" type="file" accept=".xlsx,.xls,.csv"><div class="v85-actions"><button class="v85-btn orange" id="v85VolTpl">Tải mẫu Excel Vol</button><button class="v85-btn" id="v85ClearVol">Xóa Vol</button></div><div class="v85-actions single"><button class="v85-btn orange" id="v85RunBase">Chạy định biên từ dữ liệu Vol hiện có</button></div><div class="v85-load-note">${hasVol?'Đã có dữ liệu Volume, dashboard đã tính định biên. Bấm Vẽ tuyến để xem cung đường.':'Chưa thấy Vol. Có thể upload file mới hoặc bấm chạy dữ liệu Vol đang có sẵn trong map.'}</div><div class="v85-template">ward_name | bc_name | vol_giao | vol_lay<br>Xã Tam Nông | Bưu Cục Tam Nông-Đồng Tháp | 120 | 10</div></div><div class="v85-card"><h3>2) Upload nhân sự thực tế</h3><div class="v85-muted">Excel: <b>bc_name, nvpttt_hien_co, nvxl_hien_co</b></div><input id="v85StaffFile" type="file" accept=".xlsx,.xls,.csv"><div class="v85-actions"><button class="v85-btn orange" id="v85StaffTpl">Tải mẫu Excel Nhân sự</button><button class="v85-btn" id="v85ClearStaff">Xóa nhân sự</button></div><div class="v85-template">bc_name | nvpttt_hien_co | nvxl_hien_co<br>Bưu Cục Tam Nông-Đồng Tháp | 11 | 2</div></div></div><div class="v85-map-card"><div class="v85-map-head"><div><h3>🗺️ Bản đồ hiệu suất vận hành</h3><span>Map riêng: tô màu theo thiếu/đủ/quá tải và vẽ tuyến NVPTTT</span><div class="v85-legend"><span class="v85-pill" style="color:#16a34a">● Đủ</span><span class="v85-pill" style="color:#ef4444">● Thiếu</span><span class="v85-pill" style="color:#f97316">● Quá tải</span></div></div><button class="v85-btn" id="v85ClearRoute">Xóa tuyến</button></div><div id="v85OpsMap" class="v85-map"></div></div><div><div class="v85-card"><h3>Dashboard định biên & capacity</h3><div class="v85-table-wrap"><table class="v85-table"><thead><tr><th>Bưu cục</th><th>Vol QĐ</th><th>NVPTTT</th><th>Cap PT</th><th>NVXL</th><th>Cap XL</th><th>Thao tác</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="v85-card"><h3>Chi tiết cung đường NVPTTT</h3><div id="v85RouteDetail" class="v85-muted">Bấm “Vẽ tuyến” trong Dashboard hoặc click điểm bưu cục trên bản đồ.</div></div></div></div></div>`;
    document.getElementById('v85Back').onclick=showNetwork; document.getElementById('v85VolFile').onchange=e=>readFile(e.target.files[0],saveVol); document.getElementById('v85StaffFile').onchange=e=>readFile(e.target.files[0],saveStaff); document.getElementById('v85VolTpl').onclick=()=>sampleXlsx('mau_upload_vol_xa_phuong.xlsx',[{ward_name:'Xã Tam Nông',bc_name:'Bưu Cục Tam Nông-Đồng Tháp',vol_giao:120,vol_lay:10},{ward_name:'Thị trấn Cái Nhum',bc_name:'Bưu Cục 07 Lê Lợi-Mang Thít-Vĩnh Long',vol_giao:1461,vol_lay:80}]); document.getElementById('v85StaffTpl').onclick=()=>sampleXlsx('mau_upload_nhan_su_thuc_te.xlsx',[{bc_name:'Bưu Cục Tam Nông-Đồng Tháp',nvpttt_hien_co:11,nvxl_hien_co:2},{bc_name:'Bưu Cục 07 Lê Lợi-Mang Thít-Vĩnh Long',nvpttt_hien_co:12,nvxl_hien_co:1}]); document.getElementById('v85ClearVol').onclick=()=>{if(confirm('Xóa Vol đã upload? Dữ liệu nền vẫn còn để chạy định biên.')){volMap={};localStorage.removeItem(LS_VOL);renderOps()}}; document.getElementById('v85ClearStaff').onclick=()=>{if(confirm('Xóa nhân sự thực tế?')){staffMap={};nvxlMap={};localStorage.removeItem(LS_STAFF);localStorage.removeItem(LS_NVXL);renderOps()}}; document.getElementById('v85RunBase').onclick=()=>{syncToNetwork();renderOps();alert('Đã chạy định biên từ dữ liệu Vol hiện có trong bản đồ.')}; document.getElementById('v85ClearRoute').onclick=()=>{if(routeLayer)routeLayer.clearLayers(); const d=document.getElementById('v85RouteDetail');if(d)d.innerHTML='Đã xóa tuyến.'}; page.querySelectorAll('button[data-bc]').forEach(btn=>btn.onclick=()=>drawRoute(btn.dataset.bc)); setTimeout(()=>{ensureMap();drawOpsMap();opsMap&&opsMap.invalidateSize()},100);
  }
  function showNetwork(){document.body.classList.remove('v85-ops-mode','v82-ops-mode','v77-ops-mode'); const p=document.getElementById('v82OpsPage');if(p)p.style.display='none'; document.getElementById('v82NetworkBtn')?.classList.add('active');document.getElementById('v82OpsBtn')?.classList.remove('active');syncToNetwork();setTimeout(()=>{try{map.invalidateSize()}catch(e){}},100)}
  function hook(){const ops=document.getElementById('v82OpsBtn'), net=document.getElementById('v82NetworkBtn'); if(ops){ops.onclick=null;ops.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();document.getElementById('v82OpsBtn')?.classList.add('active');document.getElementById('v82NetworkBtn')?.classList.remove('active');renderOps()},true)} if(net){net.onclick=null;net.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();showNetwork()},true)} syncToNetwork();}
  window.v85RenderOps=renderOps; window.v85DrawRoute=drawRoute; window.v85SyncToNetwork=syncToNetwork; setTimeout(hook,2200);
})();
</script>
